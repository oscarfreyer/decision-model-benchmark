schema_version = 2
protocol_version = "2.2"
protocol_project = "prj-202610-jev-medqa"
# Only accepted components: D-01a, D-03/04/05a/05b/07a, confidence measures and defect direction.
accepted_decisions = ["D-01a", "D-03", "D-04", "D-05a", "D-05b", "D-07a", "D-10"]
model_roster = ["C01","C02","C03","C04","C05","C06","C07","C08","C09","C10","C11","C12","C13","C14","C15","C16","C17","C18","C19","C20","C21","C22","C23","C24","J01"]

[prompt]
text = """Answer the medical multiple-choice question. Select exactly one supplied label. Return only a final JSON object with exactly one field: {"answer": "A"}. Use the selected label in place of A.

Question:
{stem}

Options:
{options}
"""

[benchmark]
id = "medqa"
expected_evaluation_items = 1273
closed_book = true

[execution]
study_registry = "benchmarking/output/studies"
# Pending exact values are empty; preview/mock works, live fails closed.
timeout_seconds = ""
concurrency = ""
schedule = ""
seed = ""
max_attempts = 1
retries = false
fallbacks = false
total_generated_token_allowance = 16384

[budget]
currency = "USD"
spend_cap_usd = ""
stop_threshold_usd = ""
reservation_per_request_usd = ""

# D-10 scope contains public digests only; live verification uses these ten items.
[development_validation]
purpose = "ten_question_live_verification"
questions_sha256 = "6602546ead21c0bec20c34ad3b63fbd134dce06028a956ec6c94b8872cf92b6b"
keys_sha256 = "3d00ded1b379b9a95639da837c55688c3ac58f198d23ab5342ee54b259d85651"
preparation_manifest_sha256 = "02c277f7b46797f1a7c999686105583f7fcee671836675a1b5114b00e206013e"

[analysis]
accuracy_ci = "wilson"
paired_difference_ci = "paired_percentile_bootstrap"
pairwise_test = "exact_mcnemar"
multiplicity = "holm"
s1_count = 24
s2_count = 10
confidence_bins = 10
high_confidence_threshold = 0.90
probability_sum_tolerance = "0.02"
normalization = "pending"

[freeze]
manifest = ""
human_review_record = ""

