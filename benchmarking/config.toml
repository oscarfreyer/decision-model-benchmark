schema_version = 2
execution_workflow = "lean-v1"
protocol_version = "2.3"
protocol_project = "prj-202610-jev-medqa"
accepted_decisions = ["D-01a", "D-03", "D-04", "D-05a", "D-05b", "D-07a", "R1-native-pairs-20261005", "R1-unknown-region-20261005", "R1-requested-token-target-20261005", "preprint-budget-roster-20261006", "preprint-kimi-instant-replacement-20261006", "provider-concurrency-overrides-20261006", "separate-execution-analysis-freezes-20261006", "R5-observed-cost-unverified-tokens-20261006"]
model_roster = ["C03", "C05", "C06", "C09", "C11", "C13", "C14", "C15", "C17", "C18", "C19", "C22", "C23", "C24", "C25", "J01"]

[prompt]
text = """Answer the medical multiple-choice question. Select exactly one supplied label. Return only a final JSON object with exactly one field: {"answer": "A"}. Use the selected label in place of A.

Question:
{stem}

Options:
{options}
"""

[benchmark]
id = "medqa"
expected_evaluation_items = 1273
closed_book = true

[execution]
study_registry = "benchmarking/output/studies"
timeout_seconds = 600
concurrency = 10
scheduler_version = 3
provider_concurrency = 10
rate_limit_stop_after = 3
schedule = "round_robin"
seed = 20261006
max_attempts = 1
retries = false
fallbacks = false
total_generated_token_allowance = 16384

[execution.provider_concurrency_overrides]
SiliconFlow = 10
InferenceNet = 10

[execution.provider_min_interval_seconds]
InferenceNet = 5.0
Mistral = 2.0
OpenAI = 5.0


